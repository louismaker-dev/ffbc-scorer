<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>FFBC Umpire Scorer</title>
<style>
:root{--bg:#0E1117; --panel:#161A22; --line:#2A303C; --ink:#F3F1EC; --mute:#9AA1AE; --gold:#F5C451; --bad:#FF7A6B; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--bg); color:var(--ink); font:500 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; display:flex; align-items:center; justify-content:center; padding:24px max(16px, env(safe-area-inset-left,0px))}
.box{width:100%; max-width:380px; background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:22px; display:flex; flex-direction:column; gap:14px}
.lock{width:52px; height:52px; border-radius:14px; background:#2A2410; color:var(--gold); display:grid; place-items:center; font-size:26px}
h1{margin:0; font-size:22px; line-height:1.2}
p{margin:0; color:var(--mute); font-size:14px}
input[type=password]{width:100%; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:12px; padding:14px; font-size:18px}
input[type=password]:focus{outline:3px solid var(--gold); outline-offset:1px}
label{display:flex; align-items:center; gap:10px; font-weight:600; font-size:14px}
label input{width:20px; height:20px; accent-color:var(--gold)}
button{border:0; border-radius:12px; padding:15px; font-size:17px; font-weight:800; background:var(--gold); color:#1A1405; cursor:pointer}
button:disabled{opacity:.55}
.err{color:var(--bad); font-weight:600; font-size:14px; min-height:20px}
.nojs{color:var(--gold); font-weight:600}
</style></head><body>
<form class="box" id="f" autocomplete="off">

  <p>Members only. Enter the club password.</p>
  <p class="nojs" id="nojs">This viewer can't open the page. Open the link in Chrome or Safari.</p>
  <input type="password" id="pw" placeholder="Password" aria-label="Password" autocomplete="current-password">
  <label><input type="checkbox" id="rem" checked> Remember on this phone</label>
  <button type="submit" id="go">Unlock</button>
  <div class="err" id="err" role="alert"></div>
  <p id="hint"></p>
</form>
